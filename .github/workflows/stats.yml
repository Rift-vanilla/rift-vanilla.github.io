# Раз в 3 часа забирает общие цифры у службы rift-api и кладёт их в stats.json —
# сайт показывает из него наигранные часы. Браузер посетителя сам к службе не ходит:
# у неё свой сертификат, которому доверяет только лаунчер.
name: Цифры для сайта

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Забрать цифры
        run: |
          # -k: сертификат службы самоподписанный; данные открытые, без ников.
          curl -skf --max-time 20 https://d5.rustix.me:26659/public/stats -o raw.json
          jq -e 'has("totalMs") and has("players") and (.totalMs|type=="number")' raw.json >/dev/null
          jq -c '{totalMs, players, users, sessions, online, at}' raw.json > stats.json
          rm raw.json
          cat stats.json
      - name: Сохранить, если изменилось
        run: |
          if git diff --quiet -- stats.json; then echo "без изменений"; exit 0; fi
          git -c user.name="Rift" -c user.email="rift@users.noreply.github.com" commit -qm "Цифры для сайта" -- stats.json
          git push
